{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <p class="text-sm uppercase tracking-wide text-indigo-600 font-semibold">Prise de notes</p>
            <h1 class="text-3xl font-bold">Mes notes</h1>
        </div>
        <a href="{% url 'note_create' %}" class="bg-indigo-600 text-white px-4 py-2 rounded-lg shadow hover:bg-indigo-500">+ Nouvelle note</a>
    </div>

    <div class="bg-white rounded-2xl shadow p-6">
        {% if notes %}
            <div class="space-y-4">
                {% for note in notes %}
                    <div class="border rounded-xl p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <div>
                            <h2 class="text-xl font-semibold">{{ note.title }}</h2>
                            <p class="text-slate-600 mt-2 whitespace-pre-line">{{ note.content }}</p>
                        </div>
                        <div class="flex gap-2">
                            <a href="{% url 'note_update' note.id %}" class="bg-slate-200 px-3 py-2 rounded-lg text-sm hover:bg-slate-300">Modifier</a>
                            <a href="{% url 'note_delete' note.id %}" class="bg-red-500 text-white px-3 py-2 rounded-lg text-sm hover:bg-red-400">Supprimer</a>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-slate-500">Aucune note pour le moment.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
