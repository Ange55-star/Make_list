<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    <nav class="bg-slate-900 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
            <div class="text-xl font-bold">TodoFlow</div>
            <div class="flex items-center gap-4 text-sm">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="hover:text-indigo-300">Dashboard</a>
                    <a href="{% url 'task_list' %}" class="hover:text-indigo-300">Tâches</a>
                    <a href="{% url 'note_list' %}" class="hover:text-indigo-300">Notes</a>
                    <a href="{% url 'preferences' %}" class="hover:text-indigo-300">Préférences</a>
                    <a href="{% url 'logout' %}" class="bg-red-500 px-3 py-1 rounded hover:bg-red-400">Déconnexion</a>
                {% else %}
                    <a href="{% url 'login' %}" class="hover:text-indigo-300">Connexion</a>
                    <a href="{% url 'signup' %}" class="bg-indigo-500 px-3 py-1 rounded hover:bg-indigo-400">Inscription</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        {% if messages %}
            <div class="mb-6 space-y-3">
                {% for message in messages %}
                    <div class="rounded-lg border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
