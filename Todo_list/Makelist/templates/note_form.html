{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow p-8">
    <h1 class="text-2xl font-bold mb-6">
        {% if mode == 'create' %}Créer une note{% else %}Modifier la note{% endif %}
    </h1>

    <form method="post" class="space-y-5">
        {% csrf_token %}
        <div class="space-y-2">
            {{ form.title.label_tag }}
            {{ form.title }}
        </div>
        <div class="space-y-2">
            {{ form.content.label_tag }}
            {{ form.content }}
        </div>
        <div class="flex gap-3">
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-500">Enregistrer</button>
            <a href="{% url 'note_list' %}" class="bg-slate-200 px-4 py-2 rounded-lg hover:bg-slate-300">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
