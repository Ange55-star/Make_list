{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-2xl shadow p-8">
    <h1 class="text-2xl font-bold text-red-600 mb-4">Supprimer la note</h1>
    <p class="mb-6">Voulez-vous vraiment supprimer la note : <strong>{{ note.title }}</strong> ?</p>

    <form method="post">
        {% csrf_token %}
        <div class="flex gap-3">
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-500">Oui, supprimer</button>
            <a href="{% url 'note_list' %}" class="bg-slate-200 px-4 py-2 rounded-lg hover:bg-slate-300">Annuler</a>
        </div>
    </form>
</div>
{% endblock %}
