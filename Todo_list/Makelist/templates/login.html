{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow p-8">
    <h1 class="text-2xl font-bold mb-6">Connexion</h1>
    <form method="post" class="space-y-5">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-500">Se connecter</button>
    </form>
    <p class="mt-4 text-sm text-slate-500">
        Pas encore de compte ? <a href="{% url 'signup' %}" class="text-indigo-600">Créez-en un</a>
    </p>
</div>
{% endblock %}
