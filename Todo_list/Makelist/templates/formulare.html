
{% extends "employe/base.html" %}

{% block content %}

<form method="POST" class="">
    {% csrf_token %}
    {{form.id}}
    {{form.title}}
    {{form.description}}
    {{form.due_date}}
    {{form.is_completed}}
    {{form.completed_at}}
    {{form.created_at}}
    {{form.updated_at}}
    {{form.user_id}}
    <button type="submit" class="btn btn-primary">Enregistrer</button>
</form>
{% endblock %}
